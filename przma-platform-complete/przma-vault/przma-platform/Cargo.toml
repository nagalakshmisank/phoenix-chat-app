[package]
name    = "przma-platform"
version = "0.1.0"
edition = "2021"

# przma-platform sits above all service crates.
# It owns: universal CAS, namespace resolver, cross-service metadata schema,
# and the per-service Lance schema definitions.
# Service crates (przma-calendar, przma-chat, przma-files, etc.) depend on this.

[dependencies]
przma-calendar = { path = "../przma-calendar" }  # calendar is already built

lancedb     = { workspace = true }
arrow       = { workspace = true }
arrow-schema = { workspace = true }
arrow-array  = { workspace = true }
blake3       = { workspace = true }
chrono       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
futures      = { workspace = true }
uuid         = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
