[workspace]
resolver = "2"
members = [
    "przma-calendar",
    "przma-nif",
    "przma-files",
    "przma-platform",
]

[workspace.dependencies]
# Arrow / LanceDB - LanceDB 0.9 bundles Arrow 52.2.0 internally
lancedb          = "0.9"
arrow            = { version = "=52.2.0", features = ["prettyprint"] }
arrow-schema     = "=52.2.0"
arrow-array      = "=52.2.0"
arrow-buffer     = "=52.2.0"
arrow-cast       = "=52.2.0"

# Storage / Hashing
blake3           = "1"
duckdb           = { version = "1", features = ["bundled"] }

# Time / Recurrence
# Pinned: chrono >= 0.4.39 adds Datelike::quarter(), which collides with
# arrow-arith 52.2.0's ChronoDateExt::quarter() (E0034). Keep <= 0.4.38.
chrono           = { version = "=0.4.38", features = ["serde"] }
rrule            = "0.13"

# Serde / Async
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tokio            = { version = "1", features = ["full"] }
futures          = "0.3"

# Utilities
uuid             = { version = "1", features = ["v4"] }
thiserror        = "1"
anyhow           = "1"
tracing          = "0.1"

# Object store (S3-compatible: AWS, Linode, Cloudflare R2, MinIO)
object_store     = { version = "0.11", features = ["aws"] }
bytes            = "1"

# NIF
rustler          = "0.33"

# Encryption (at-rest for private blobs)
chacha20poly1305 = "0.10"
rand             = "0.8"
