[package]
name = "przma-files-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.19"
base64 = "0.21"

# ✅ USE THE PROVEN PLATFORM IMPLEMENTATIONS
przma-files = { path = "../przma-vault/przma-files" }
przma-platform = { path = "../przma-vault/przma-platform" }
przma-calendar = { path = "../przma-vault/przma-calendar" }
arrow-array = "=52.2.0"
arrow-schema = "=52.2.0"
futures = "0.3"
tauri-plugin-dialog = "2"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[profile.release]
opt-level = "z"
lto = true

