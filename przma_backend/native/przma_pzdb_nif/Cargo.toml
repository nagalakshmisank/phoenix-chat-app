[package]
name    = "przma_pzdb_nif"
version = "0.1.0"
edition = "2021"

[lib]
name       = "przma_pzdb_nif"
crate-type = ["cdylib"]

# Updated for the chrono/arrow resolver conflict: lancedb 0.9 required
# chrono >= 0.4.35, which is unsatisfiable under an exact chrono pin below
# that line. lancedb 0.10 + arrow 53 resolves the underlying chrono/arrow
# `quarter()` naming collision upstream, so no pin workaround is needed.
[dependencies]
rustler      = "0.36"
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
futures      = "0.3"
lancedb      = "0.10"
arrow-array  = "=53.0.0"
arrow-schema = "=53.0.0"
arrow-json   = "=53.0.0"
chrono       = "0.4"

# If `mix compile` dies inside the `lance` crate with a type-recursion /
# overflow error, that's a separate known issue unrelated to this chrono
# fix — it stems from `lance`'s macro-generated type depth, not from
# version resolution. Raising rustc's recursion limit or checking for a
# newer `lance`/`lancedb` patch is the next step, not re-pinning versions.

# Do NOT add `panic = "abort"` — it stops Rustler from catching NIF panics and a
# panic would take down the whole BEAM instead of raising an Elixir error.